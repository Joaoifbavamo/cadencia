  <body>
    <script>
      try {
        const t = localStorage.getItem("cadencia-theme") || "system";
        document.documentElement.dataset.theme =
          t === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : t;
      } catch {}
    </script>
    <div id="root"></div>
  </body>
